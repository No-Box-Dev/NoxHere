name = "noxfeed-response"
main = "src/index.js"
compatibility_date = "2026-09-09"

[observability]
enabled = true

# Required production secret: `wrangler secret put ANTHROPIC_API_KEY`.
# NoxFeed owns its generation provider; callers only receive validated output.

[[d1_databases]]
binding = "DEMO_DB"
database_name = "noxfeed-demo"
