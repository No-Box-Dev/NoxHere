# The project, targets, and source paths use the unified NoxHere identity.
# Distribution identifiers below remain stable so existing installations,
# keychain entries, and App Store records continue to work across upgrades.
name: NoxHere
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.11"
    CURRENT_PROJECT_VERSION: "22"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "GG6633R92T"
  # Signing is per-config (mirrors NoxKey's MAS setup): Debug auto-signs for
  # local runs; Release uses Manual signing so the distribution Application
  # cert + the "NoxFeed App Store" profile are applied deterministically. An
  # explicit identity under Automatic signing fails the archive with
  # "conflicting provisioning settings", so Release must be Manual.
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      CODE_SIGN_STYLE: Manual
      # Use the exact legacy MAS certificate carried by the installed profile.
      # New Xcode versions otherwise resolve the generic name to the newer
      # Apple Distribution certificate, which this profile does not contain.
      CODE_SIGN_IDENTITY: "3rd Party Mac Developer Application: Jasper Middendorp (GG6633R92T)"
      PROVISIONING_PROFILE_SPECIFIER: "NoxFeed App Store"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  MenuBarExtraAccess:
    url: https://github.com/orchetect/MenuBarExtraAccess
    from: 1.0.0

schemes:
  NoxHere:
    build:
      targets:
        NoxHere: all
    test:
      targets:
        - NoxHereTests
        - NoxHereUITests
    run:
      config: Debug
    archive:
      config: Release
  NoxHereMobile:
    build:
      targets:
        NoxHereMobile: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  NoxHere:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NoxHere
        excludes:
          - Info.plist
          - NoxHere.entitlements
    info:
      path: NoxHere/Info.plist
      properties:
        LSUIElement: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # CFBundleDisplayName controls the name Finder shows; CFBundleName
        # controls the running-app menu title + dock tooltip. Both are the
        CFBundleName: NoxHere
        CFBundleDisplayName: NoxHere
        NSHumanReadableCopyright: "© No-Box-Dev"
        NSUserNotificationAlertStyle: banner
        # Required — the asset-catalog AppIcon set is compiled into
        # Assets.car by ASSETCATALOG_COMPILER_APPICON_NAME, but macOS also
        # needs this key to look it up at runtime for Dock + Finder.
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: NoxHere/NoxHere.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.noboxdev.noxfeed
    settings:
      base:
        PRODUCT_NAME: NoxHere
        PRODUCT_MODULE_NAME: NoxHere
        PRODUCT_BUNDLE_IDENTIFIER: dev.noboxdev.noxfeed
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: KeyboardShortcuts
      - package: MenuBarExtraAccess
  NoxHereMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NoxHereMobile
        excludes:
          - Info.plist
          - NoxHereMobile.entitlements
      - path: NoxHere/App/AppState.swift
      - path: NoxHere/Models
      - path: NoxHere/Services/APIClient.swift
      - path: NoxHere/Services/AccountsStore.swift
      - path: NoxHere/Services/AuthService.swift
      - path: NoxHere/Services/Config.swift
      - path: NoxHere/Services/DemoSessionService.swift
      - path: NoxHere/Services/Keychain.swift
      - path: NoxHere/Assets.xcassets
    info:
      path: NoxHereMobile/Info.plist
      properties:
        CFBundleName: NoxHere
        CFBundleDisplayName: NoxHere
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: NoxHereMobile/NoxHereMobile.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.noboxdev.noxfeed
    settings:
      base:
        PRODUCT_NAME: NoxHere
        PRODUCT_MODULE_NAME: NoxHereMobile
        PRODUCT_BUNDLE_IDENTIFIER: dev.noboxdev.noxfeed
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: ""
  NoxHereTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NoxHereTests
    dependencies:
      - target: NoxHere
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: dev.noboxdev.noxfeed.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NoxHere.app/Contents/MacOS/NoxHere"
  NoxHereUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NoxHereUITests
    dependencies:
      - target: NoxHere
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.noboxdev.noxfeed.ui-tests
        GENERATE_INFOPLIST_FILE: YES
