name = "noxhere"
compatibility_date = "2026-09-09"
pages_build_output_dir = "dist"

# Verified numeric GitHub user ids allowed to open the internal, read-only
# business dashboard. Numeric ids remain stable when a GitHub login changes.
[vars]
PLATFORM_ADMIN_GITHUB_IDS = "196446605"

[[d1_databases]]
binding = "DB"
database_name = "noxhere"
database_id = "c94084e6-d0be-423c-8de6-249e7cf8bf25"

# Durable background-work queue. functions/api/webhook.js produces here instead
# of using context.waitUntil; the background Worker consumes them.
# PROVISION BEFORE DEPLOY: `wrangler queues create noxhere-tasks` (+ the DLQ).
# If the binding is absent, enqueueTask records to op_failures instead of 500ing
# the webhook — but the queue must exist for background work to actually run.
[[queues.producers]]
binding = "TASK_QUEUE"
queue = "noxhere-tasks"

[[services]]
binding = "FEEDBACK_RESPONSE"
service = "noxhere-feedback"

[[services]]
binding = "PLANNING_SERVICE"
service = "noxhere-planning"

[[services]]
binding = "TELEMETRY_RESPONSE"
service = "noxhere-telemetry"

# Server-only event ingestion. The corresponding TELEMETRY_INGEST_KEY secret is
# scoped to NoxHere's Telemetry source and is never exposed to the browser.
[[services]]
binding = "TELEMETRY_INGEST"
service = "noxhere-telemetry"

[[services]]
binding = "ACTIVITY_RESPONSE"
service = "noxhere-activity"

# Spec attachments — user-uploaded documents (.md, .pdf, .docx, .html)
# attached to a Spec. Objects are keyed `spec/<org_id>/<spec_id>/<attachment_id>`
# for tenant isolation. See functions/api/specs/[id]/attachments/*.
# PROVISION BEFORE DEPLOY: `wrangler r2 bucket create noxhere-spec-attachments`.
# Absent binding = attachment endpoints 503 with a clear message.
[[r2_buckets]]
binding = "SPEC_ATTACHMENTS"
bucket_name = "noxhere-spec-attachments"

# Feedback screenshots are deleted from the same admin surface that owns sites.
[[r2_buckets]]
binding = "FEEDBACK_ASSETS"
bucket_name = "feedback-assets"
