name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject changes to released migrations
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-migration-immutability.mjs "$BASE_REF"
      - name: Apply migrations to a fresh database
        run: npx wrangler d1 migrations apply DB --local --persist-to "$RUNNER_TEMP/noxconnect-d1" --config workers/api-gateway/wrangler.jsonc --env=""
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run typecheck:functions
      - run: npm run build:api-gateway
      - name: Dry-run private Workers
        run: |
          npx wrangler deploy --dry-run --config services/connect/wrangler.jsonc --env="" --outdir "$RUNNER_TEMP/capabilities"
          npx wrangler deploy --dry-run --config services/scheduler/wrangler.toml --env="" --outdir "$RUNNER_TEMP/orchestrator"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enforce active platform event milestone
        run: npm run milestones:verify
      - name: Verify API docs and complete CLI command reference
        run: npm run docs:check
      - name: Verify project capabilities through the compiled Pages router
        run: npm run test:project-router
      - run: npm test

  noxhere-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            services/gateway/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm ci --prefix services/gateway
      - name: Verify NoxHere web application
        run: npm --prefix apps/web run check
      - name: Verify NoxHere gateway
        run: npm --prefix services/gateway test && npm --prefix services/gateway run typecheck && npm --prefix services/gateway run build

  ticket:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ticket
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/ticket/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  feed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/feed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/feed/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Verify the unified public API contract
        run: NOX_OPENAPI_PATH=../../public/openapi.json npm run docs:check
      - run: npm run build

  noxspot-capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/spot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/spot/package-lock.json
      - run: npm ci
      - run: npm run types
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  cue:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cue
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/cue/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: npm ci
      - name: Verify Cue Worker, contracts, and build
        run: npm run check
      - name: Verify TypeScript/Python SDK parity
        run: npm run sdk:parity
      - name: Build Python distribution
        run: python -m pip install build && python -m build packages/python-sdk
