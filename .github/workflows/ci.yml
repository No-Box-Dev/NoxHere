name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject changes to released migrations
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-migration-immutability.mjs "$BASE_REF"
      - name: Apply migrations to a fresh database
        run: npx wrangler d1 migrations apply DB --local --persist-to "$RUNNER_TEMP/noxconnect-d1" --config workers/api-gateway/wrangler.jsonc --env=""
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run typecheck:functions
      - run: npm run build:api-gateway
      - name: Dry-run private Workers
        run: |
          npx wrangler deploy --dry-run --config workers/connection-capabilities/wrangler.jsonc --env="" --outdir "$RUNNER_TEMP/capabilities"
          npx wrangler deploy --dry-run --config cron/wrangler.toml --env="" --outdir "$RUNNER_TEMP/orchestrator"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enforce active platform event milestone
        run: npm run milestones:verify
      - name: Verify API docs and complete CLI command reference
        run: npm run docs:check
      - name: Verify project capabilities through the compiled Pages router
        run: npm run test:project-router
      - run: npm test

  noxspot-capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/noxspot-capture
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/noxspot-capture/package-lock.json
      - run: npm ci
      - run: npm run types
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
