name: Deploy feedback widget

on:
  push:
    branches: [main]
    paths:
      - packages/feedback-widget/**
      - scripts/assert-main-release.mjs
      - .github/workflows/deploy-feedback-widget.yml

concurrency:
  group: deploy-feedback-widget
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_SHA: ${{ github.sha }}
    defaults:
      run:
        working-directory: packages/feedback-widget
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: packages/feedback-widget/package-lock.json
      - name: Verify patched Node.js binary
        run: |
          node --input-type=module -e 'const expected = "22.23.4"; if (process.versions.node !== expected) { console.error(`Expected patched Node.js ${expected}; running ${process.versions.node}`); process.exit(1); } console.log(`Verified Node.js ${process.versions.node}`);'
      - name: Verify release is the current main commit
        run: node ../../scripts/assert-main-release.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish loader
        run: npx wrangler r2 object put feedback-assets/feedback.min.js --file dist/feedback.min.js --remote --force --content-type application/javascript --cache-control 'public, max-age=300'
      - name: Publish widget core
        run: npx wrangler r2 object put feedback-assets/feedback-core.min.js --file dist/feedback-core.min.js --remote --force --content-type application/javascript --cache-control 'public, max-age=300'
