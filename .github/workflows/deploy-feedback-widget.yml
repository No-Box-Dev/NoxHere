name: Deploy feedback widget

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/feedback-widget/**
      - .github/workflows/deploy-feedback-widget.yml

concurrency:
  group: deploy-feedback-widget
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: packages/feedback-widget
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/feedback-widget/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish loader
        run: npx wrangler r2 object put noxspot-assets/noxspot.min.js --file dist/noxspot.min.js --remote --force --content-type application/javascript --cache-control 'public, max-age=300'
      - name: Publish legacy loader
        run: npx wrangler r2 object put noxspot-assets/blindspot.min.js --file dist/blindspot.min.js --remote --force --content-type application/javascript --cache-control 'public, max-age=300'
      - name: Publish widget core
        run: npx wrangler r2 object put noxspot-assets/noxspot-core.min.js --file dist/noxspot-core.min.js --remote --force --content-type application/javascript --cache-control 'public, max-age=300'
