name: Deploy NoxHere

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-noxhere
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Verify release is the current main commit
        run: node scripts/assert-main-release.mjs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install service dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --prefix services/telemetry
          npm ci --prefix services/activity
          npm ci --prefix services/gateway
          npm ci --prefix services/feedback
          npm ci --prefix services/planning
      - name: Build NoxHere surface and private API
        run: |
          npm run build:web
          npm run build:gateway
          npm run build:api-gateway
        env:
          VITE_GITHUB_APP_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}

      - name: Resolve dedicated staging Activity database
        run: node scripts/prepare-staging-activity-database.mjs
      - name: Migrate staging platform database
        run: npx wrangler d1 migrations apply DB --config services/core-api/wrangler.jsonc --env staging --remote
      - name: Migrate staging Activity database
        run: npx wrangler d1 migrations apply DEMO_DB --config services/activity/wrangler.toml --env staging --remote
      - name: Migrate staging Planning database
        run: npx wrangler d1 migrations apply DB --config services/planning/wrangler.jsonc --env staging --remote
      - name: Migrate staging gateway database
        run: npx wrangler d1 migrations apply CONTROL_DB --config services/gateway/wrangler.jsonc --env staging --remote
      - name: Verify required staging provider-ingress secrets
        run: >-
          node scripts/check-worker-secrets.mjs services/connections/wrangler.jsonc staging
          GITHUB_WEBHOOK_SECRET POSTMARK_WEBHOOK_SECRET SLACK_CLIENT_ID
          SLACK_CLIENT_SECRET SLACK_SIGNING_SECRET
      - name: Deploy staging Connections capability
        run: npx wrangler deploy --config services/connections/wrangler.jsonc --env staging --message "$DEPLOY_SHA"
      - name: Deploy staging Telemetry capability
        run: npx wrangler deploy --config services/telemetry/wrangler.jsonc --env staging --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Deploy staging Activity capability
        run: npx wrangler deploy --config services/activity/wrangler.toml --env staging --message "$DEPLOY_SHA"
      - name: Deploy staging Planning capability
        run: npx wrangler deploy --config services/planning/wrangler.jsonc --env staging --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Deploy staging Feedback capability
        run: npx wrangler deploy --config services/feedback/wrangler.jsonc --env staging --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Synchronize staging internal authorization secret
        env:
          NOXHERE_INTERNAL_SECRET: ${{ secrets.NOXHERE_INTERNAL_SECRET }}
        run: |
          test -n "$NOXHERE_INTERNAL_SECRET"
          printf '%s' "$NOXHERE_INTERNAL_SECRET" | npx wrangler secret put NOXHERE_INTERNAL_SECRET --config services/core-api/wrangler.jsonc --env staging
          printf '%s' "$NOXHERE_INTERNAL_SECRET" | npx wrangler secret put NOXHERE_INTERNAL_SECRET --config services/gateway/wrangler.jsonc --env staging
          printf '%s' "$NOXHERE_INTERNAL_SECRET" | npx wrangler secret put NOXHERE_INTERNAL_SECRET --config services/connections/wrangler.jsonc --env staging
      - name: Synchronize staging app activity secrets
        env:
          TELEMETRY_INGEST_KEY: ${{ secrets.TELEMETRY_STAGING_INGEST_KEY }}
          NOXHERE_IDENTITY_HASH_KEY: ${{ secrets.NOXHERE_STAGING_IDENTITY_HASH_KEY }}
        run: |
          test -n "$TELEMETRY_INGEST_KEY"
          test -n "$NOXHERE_IDENTITY_HASH_KEY"
          printf '%s' "$TELEMETRY_INGEST_KEY" | npx wrangler secret put TELEMETRY_INGEST_KEY --config services/core-api/wrangler.jsonc --env staging
          printf '%s' "$NOXHERE_IDENTITY_HASH_KEY" | npx wrangler secret put NOXHERE_IDENTITY_HASH_KEY --config services/core-api/wrangler.jsonc --env staging
      - name: Deploy staging private API
        run: npx wrangler deploy --config services/core-api/wrangler.jsonc --env staging --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Synchronize optional staging background-worker secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEMETRY_INGEST_KEY: ${{ secrets.TELEMETRY_INGEST_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY --config services/scheduler/wrangler.toml --env staging
          fi
          if [ -n "$TELEMETRY_INGEST_KEY" ]; then
            printf '%s' "$TELEMETRY_INGEST_KEY" | npx wrangler secret put TELEMETRY_INGEST_KEY --config services/scheduler/wrangler.toml --env staging
          fi
      - name: Deploy staging background worker
        run: npx wrangler deploy --config services/scheduler/wrangler.toml --env staging --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Deploy staging NoxHere gateway
        run: npx wrangler deploy --config services/gateway/wrangler.jsonc --env staging --message "$DEPLOY_SHA"
      - name: Smoke staging release
        run: node scripts/smoke-deployment.mjs https://noxhere-staging.jasper-414.workers.dev https://noxhere-feedback-staging.jasper-414.workers.dev "$DEPLOY_SHA"
      - name: Verify every staging API operation
        run: npm run health:api-surface -- https://noxhere-staging.jasper-414.workers.dev

      - name: Re-verify release is still the current main commit
        run: node scripts/assert-main-release.mjs

      - name: Migrate production platform database
        run: npx wrangler d1 migrations apply DB --config services/core-api/wrangler.jsonc --env="" --remote
      - name: Migrate production Activity database
        run: npx wrangler d1 migrations apply DEMO_DB --config services/activity/wrangler.toml --env="" --remote
      - name: Migrate production Planning database
        run: npx wrangler d1 migrations apply DB --config services/planning/wrangler.jsonc --env="" --remote
      - name: Migrate production gateway database
        run: npx wrangler d1 migrations apply CONTROL_DB --config services/gateway/wrangler.jsonc --env="" --remote
      - name: Verify required production provider-ingress secrets
        run: >-
          node scripts/check-worker-secrets.mjs services/connections/wrangler.jsonc default
          GITHUB_WEBHOOK_SECRET POSTMARK_WEBHOOK_SECRET SLACK_CLIENT_ID
          SLACK_CLIENT_SECRET SLACK_SIGNING_SECRET
      - name: Deploy production Connections capability
        run: npx wrangler deploy --config services/connections/wrangler.jsonc --env="" --message "$DEPLOY_SHA"
      - name: Deploy production Telemetry capability
        run: npx wrangler deploy --config services/telemetry/wrangler.jsonc --env="" --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Deploy production Activity capability
        run: npx wrangler deploy --config services/activity/wrangler.toml --env="" --message "$DEPLOY_SHA"
      - name: Deploy production Planning capability
        run: npx wrangler deploy --config services/planning/wrangler.jsonc --env="" --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Deploy production Feedback capability
        run: npx wrangler deploy --config services/feedback/wrangler.jsonc --env="" --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Synchronize production internal authorization secret
        env:
          NOXHERE_INTERNAL_SECRET: ${{ secrets.NOXHERE_INTERNAL_SECRET }}
        run: |
          test -n "$NOXHERE_INTERNAL_SECRET"
          printf '%s' "$NOXHERE_INTERNAL_SECRET" | npx wrangler secret put NOXHERE_INTERNAL_SECRET --config services/core-api/wrangler.jsonc --env=""
          printf '%s' "$NOXHERE_INTERNAL_SECRET" | npx wrangler secret put NOXHERE_INTERNAL_SECRET --config services/gateway/wrangler.jsonc --env=""
          printf '%s' "$NOXHERE_INTERNAL_SECRET" | npx wrangler secret put NOXHERE_INTERNAL_SECRET --config services/connections/wrangler.jsonc --env=""
      - name: Synchronize production app activity secrets
        env:
          TELEMETRY_INGEST_KEY: ${{ secrets.TELEMETRY_INGEST_KEY }}
          NOXHERE_IDENTITY_HASH_KEY: ${{ secrets.NOXHERE_IDENTITY_HASH_KEY }}
        run: |
          test -n "$TELEMETRY_INGEST_KEY"
          test -n "$NOXHERE_IDENTITY_HASH_KEY"
          printf '%s' "$TELEMETRY_INGEST_KEY" | npx wrangler secret put TELEMETRY_INGEST_KEY --config services/core-api/wrangler.jsonc --env=""
          printf '%s' "$NOXHERE_IDENTITY_HASH_KEY" | npx wrangler secret put NOXHERE_IDENTITY_HASH_KEY --config services/core-api/wrangler.jsonc --env=""
      - name: Deploy production private API
        run: npx wrangler deploy --config services/core-api/wrangler.jsonc --env="" --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Synchronize optional production background-worker secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEMETRY_INGEST_KEY: ${{ secrets.TELEMETRY_INGEST_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY --config services/scheduler/wrangler.toml --env=""
          fi
          if [ -n "$TELEMETRY_INGEST_KEY" ]; then
            printf '%s' "$TELEMETRY_INGEST_KEY" | npx wrangler secret put TELEMETRY_INGEST_KEY --config services/scheduler/wrangler.toml --env=""
          fi
      - name: Deploy production background worker
        run: npx wrangler deploy --config services/scheduler/wrangler.toml --env="" --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Deploy production NoxHere gateway
        run: |
          GATEWAY_VERSION_TAG="${DEPLOY_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx wrangler versions upload --config services/gateway/wrangler.jsonc --env="" --tag "$GATEWAY_VERSION_TAG" --message "$DEPLOY_SHA"
          for attempt in 1 2 3 4 5; do
            if npx wrangler versions deploy --config services/gateway/wrangler.jsonc --env="" --version-tag "$GATEWAY_VERSION_TAG" --message "$DEPLOY_SHA" --yes; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Gateway version was still unavailable after $attempt deployment attempts" >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "Gateway version is not available yet; retrying in ${delay}s" >&2
            sleep "$delay"
          done
      - name: Smoke production release
        run: node scripts/smoke-deployment.mjs https://app.noxhere.com https://app.noxhere.com "$DEPLOY_SHA"
      - name: Verify every production API operation
        run: npm run health:api-surface -- https://app.noxhere.com
      - name: Verify production ecosystem
        # Updating Cron Triggers can take up to 15 minutes to propagate across
        # Cloudflare. Keep the gate strict, but allow the new schedule enough
        # time to publish its first healthy heartbeat.
        env:
          ECOSYSTEM_HEALTH_WAIT_SECONDS: "960"
        run: node scripts/check-ecosystem-health.mjs https://app.noxhere.com noxhere "$DEPLOY_SHA"
