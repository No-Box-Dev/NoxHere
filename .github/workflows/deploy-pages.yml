name: Deploy NoxHere

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-noxhere
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install service dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --prefix services/cue
          npm ci --prefix services/feed
          npm ci --prefix services/gateway
          npm ci --prefix services/spot
          npm ci --prefix services/ticket
      - name: Build NoxHere surface and private API
        run: |
          npm run build:web
          npm run build:gateway
          npm run build:api-gateway
        env:
          VITE_GITHUB_APP_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}

      - name: Migrate staging platform database
        run: npx wrangler d1 migrations apply DB --config workers/api-gateway/wrangler.jsonc --env staging --remote
      - name: Migrate staging Feed database
        run: npx wrangler d1 migrations apply DEMO_DB --config services/feed/wrangler.toml --env staging --remote
      - name: Migrate staging Ticket database
        run: npx wrangler d1 migrations apply DB --config services/ticket/wrangler.jsonc --env staging --remote
      - name: Migrate staging gateway database
        run: npx wrangler d1 migrations apply CONTROL_DB --config services/gateway/wrangler.jsonc --env staging --remote
      - name: Deploy staging Connect capability
        run: npx wrangler deploy --config services/connect/wrangler.jsonc --env staging --message "$DEPLOY_SHA"
      - name: Deploy staging Cue capability
        run: npx wrangler deploy --config services/cue/wrangler.jsonc --env staging --message "$DEPLOY_SHA"
      - name: Deploy staging Feed capability
        run: npx wrangler deploy --config services/feed/wrangler.toml --env staging --message "$DEPLOY_SHA"
      - name: Deploy staging Ticket capability
        run: npx wrangler deploy --config services/ticket/wrangler.jsonc --env staging --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Deploy staging Spot capability
        run: npx wrangler deploy --config services/spot/wrangler.jsonc --env staging --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Deploy staging private API
        run: npx wrangler deploy --config workers/api-gateway/wrangler.jsonc --env staging --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Deploy staging scheduler
        run: npx wrangler deploy --config services/scheduler/wrangler.toml --env staging --message "$DEPLOY_SHA"
      - name: Deploy staging NoxHere gateway
        run: npx wrangler deploy --config services/gateway/wrangler.jsonc --env staging --message "$DEPLOY_SHA"
      - name: Smoke staging release
        run: node scripts/smoke-deployment.mjs https://noxhere-staging.jasper-414.workers.dev https://noxspot-api-staging.jasper-414.workers.dev "$DEPLOY_SHA"

      - name: Migrate production platform database
        run: npx wrangler d1 migrations apply DB --config workers/api-gateway/wrangler.jsonc --env="" --remote
      - name: Migrate production Feed database
        run: npx wrangler d1 migrations apply DEMO_DB --config services/feed/wrangler.toml --env="" --remote
      - name: Migrate production Ticket database
        run: npx wrangler d1 migrations apply DB --config services/ticket/wrangler.jsonc --env="" --remote
      - name: Migrate production gateway database
        run: npx wrangler d1 migrations apply CONTROL_DB --config services/gateway/wrangler.jsonc --env="" --remote
      - name: Deploy production Connect capability
        run: npx wrangler deploy --config services/connect/wrangler.jsonc --env="" --message "$DEPLOY_SHA"
      - name: Deploy production Cue capability
        run: npx wrangler deploy --config services/cue/wrangler.jsonc --env="" --message "$DEPLOY_SHA"
      - name: Deploy production Feed capability
        run: npx wrangler deploy --config services/feed/wrangler.toml --env="" --message "$DEPLOY_SHA"
      - name: Deploy production Ticket capability
        run: npx wrangler deploy --config services/ticket/wrangler.jsonc --env="" --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Deploy production Spot capability
        run: npx wrangler deploy --config services/spot/wrangler.jsonc --env="" --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Deploy production private API
        run: npx wrangler deploy --config workers/api-gateway/wrangler.jsonc --env="" --var "BUILD_SHA:$DEPLOY_SHA" --message "$DEPLOY_SHA"
      - name: Deploy production scheduler
        run: npx wrangler deploy --config services/scheduler/wrangler.toml --env="" --message "$DEPLOY_SHA"
      - name: Deploy production NoxHere gateway
        run: npx wrangler deploy --config services/gateway/wrangler.jsonc --env="" --message "$DEPLOY_SHA"
      - name: Smoke production release
        run: node scripts/smoke-deployment.mjs https://app.noxhere.com https://api.noxspot.dev "$DEPLOY_SHA"
      - name: Notify ecosystem verification
        env:
          GH_TOKEN: ${{ secrets.NOXHERE_DISPATCH_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh api repos/No-Box-Dev/NoxHere/dispatches --method POST -f event_type=nox-service-deployed -f 'client_payload[service]=noxhere' -f "client_payload[sha]=$DEPLOY_SHA"
          fi
