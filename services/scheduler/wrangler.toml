name = "noxhere-orchestrator"
main = "src/index.js"
compatibility_date = "2026-09-09"
workers_dev = false
preview_urls = false

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
GITHUB_APP_ID = "3652510"
NOXHERE_PUBLIC_URL = "https://app.noxhere.com"
FEEDBACK_PUBLIC_URL = "https://app.noxhere.com/api/feedback/public/v1"

# Feedback owns issue/Slack presentation. This private service binding exposes
# its versioned renderer without sending product data over the public Internet.
[[services]]
binding = "FEEDBACK_RESPONSE"
service = "noxhere-feedback"

[[services]]
binding = "NOXHERE_EMAIL"
service = "noxhere-connections"

[[services]]
binding = "NOXHERE"
service = "noxhere-connections"

[[services]]
binding = "TELEMETRY_RESPONSE"
service = "noxhere-telemetry"

# Server-only Telemetry ingestion for background-worker failures. The matching
# TELEMETRY_INGEST_KEY secret is scoped to NoxHere's source.
[[services]]
binding = "TELEMETRY_INGEST"
service = "noxhere-telemetry"

[[services]]
binding = "ACTIVITY_RESPONSE"
service = "noxhere-activity"

# Same D1 database as the Pages app — the cron writes the same tables
# (repos, issues, pull_requests, features, members, reconcile_runs).
[[d1_databases]]
binding = "DB"
database_name = "noxhere"
database_id = "c94084e6-d0be-423c-8de6-249e7cf8bf25"
migrations_dir = "../../migrations"

# Reconciliation tick. Webhooks are the running source of truth; this
# cron exists to catch the cases webhooks structurally miss: deletes
# (GitHub doesn't fire delete webhooks), missed deliveries during
# deploys, and label changes on issues created before the App was
# installed. 30 min is a reasonable RPO without being chatty.
[triggers]
crons = ["* * * * *", "*/30 * * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.05

# Durable background-work consumer. The Pages app (functions/api/webhook.js)
# produces narrate / PR-match / bootstrap / repo-sync tasks here; this Worker's
# queue() handler runs them with retries + a dead-letter queue. PROVISION BEFORE
# DEPLOY: `wrangler queues create noxhere-tasks` and
# `wrangler queues create noxhere-tasks-dlq`. The consumer records terminal
# failures on the final (1 + max_retries) delivery, so MAX_DELIVERIES in
# src/index.js must equal max_retries + 1 (currently 5).
[[queues.consumers]]
queue = "noxhere-tasks"
max_batch_size = 10
max_retries = 4
dead_letter_queue = "noxhere-tasks-dlq"

# The consumer stages follow-up outbox deliveries and the scheduled recovery
# sweep re-enqueues durable pending rows onto this same queue.
[[queues.producers]]
binding = "TASK_QUEUE"
queue = "noxhere-tasks"

# Event-table retention: the daily archival sweep writes pruned `events` rows
# here as NDJSON before deleting them from D1 (see src/archive-events.js).
# PROVISION BEFORE DEPLOY: `wrangler r2 bucket create noxhere-events-archive`.
[[r2_buckets]]
binding = "EVENTS_ARCHIVE"
bucket_name = "noxhere-events-archive"

# Secrets required on this worker before the first run:
#   GITHUB_APP_PRIVATE_KEY (reconcile + bootstrap/sync tasks; App ID is a public var)
#   ENCRYPTION_KEY (Slack connection tokens and user-provided AI keys)
# Optional feature secrets:
#   ANTHROPIC_API_KEY (NoxHere-owned Telemetry/Feedback generation)
#   TELEMETRY_INGEST_KEY (NoxHere-scoped background failure reporting)
# Set via: wrangler secret put <NAME> --name noxhere-orchestrator
# Activity event and release-note generation uses the secret held by the
# noxhere-activity Worker rather than this orchestrator.

# Staging is deliberately isolated: separate data, queue, archive, provider
# credentials, and product-service deployments. A five-minute schedule keeps
# recovery and readiness behavior representative without touching production.
[env.staging]
name = "noxhere-orchestrator-staging"
workers_dev = true

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[env.staging.triggers]
crons = ["* * * * *", "*/5 * * * *"]

[env.staging.vars]
GITHUB_APP_ID = "3652510"
NOXHERE_PUBLIC_URL = "https://noxhere-staging.jasper-414.workers.dev"
FEEDBACK_PUBLIC_URL = "https://noxhere-feedback-staging.jasper-414.workers.dev"

[[env.staging.services]]
binding = "FEEDBACK_RESPONSE"
service = "noxhere-feedback-staging"

[[env.staging.services]]
binding = "NOXHERE_EMAIL"
service = "noxhere-connections-staging"

[[env.staging.services]]
binding = "NOXHERE"
service = "noxhere-connections-staging"

[[env.staging.services]]
binding = "TELEMETRY_RESPONSE"
service = "noxhere-telemetry-staging"

[[env.staging.services]]
binding = "TELEMETRY_INGEST"
service = "noxhere-telemetry-staging"

[[env.staging.services]]
binding = "ACTIVITY_RESPONSE"
service = "noxhere-activity-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "noxhere-staging"
database_id = "3a9d9857-c26d-4421-9fbd-b81f474864d3"
migrations_dir = "../../migrations"

[[env.staging.queues.consumers]]
queue = "noxhere-tasks-staging"
max_batch_size = 10
max_retries = 4
dead_letter_queue = "noxhere-tasks-staging-dlq"

[[env.staging.queues.producers]]
binding = "TASK_QUEUE"
queue = "noxhere-tasks-staging"

[[env.staging.r2_buckets]]
binding = "EVENTS_ARCHIVE"
bucket_name = "noxhere-events-archive-staging"
