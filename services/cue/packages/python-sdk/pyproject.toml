[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "noxcue"
dynamic = ["version"]
description = "Detection-first Python SDK for NoxCue"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "No-Box-Dev" }]
keywords = ["noxcue", "monitoring", "reliability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed"
]

[project.urls]
Repository = "https://github.com/No-Box-Dev/noxconnect"

[tool.hatch.build.targets.wheel]
packages = ["src/noxcue"]

[tool.hatch.version]
path = "src/noxcue/_contract.py"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
