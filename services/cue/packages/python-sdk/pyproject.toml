[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "noxcue"
version = "0.2.0"
description = "Compatibility shim for NoxHere telemetry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "No-Box-Dev" }]
keywords = ["noxcue", "monitoring", "reliability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed"
]
dependencies = ["noxhere>=0.2.0,<1"]

[project.urls]
Repository = "https://github.com/No-Box-Dev/NoxHere"

[tool.hatch.build.targets.wheel]
packages = ["src/noxcue"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
